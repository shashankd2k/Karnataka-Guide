server {
    listen 80;
    server_name _;

    # 1. 55 MiB limit for request body (supports 50 MiB PDF with multipart overhead)
    client_max_body_size 55M;
    client_body_timeout 120s;

    # 2. Static Frontend & SPA Fallback Routing
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 3. Static Asset Long-Term Caching
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 4. API Reverse Proxy with Unbuffered Real-Time SSE Streaming
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL FOR SSE: Disable buffering to allow real-time token streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Timeouts suited for slow local CPU inference (phi3:mini) and large file uploads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
